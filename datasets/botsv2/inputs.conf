# Register the BOTSv2 lists with ES's asset and identity framework
# (SA-IdentityManagement merges them into asset_lookup_by_* / identity_lookup_expanded).
[identity_manager://botsv2_assets]
category = botsv2
description = BOTSv2 assets derived from the dataset
target = asset
url = lookup://botsv2_assets_lookup
disabled = 0

[identity_manager://botsv2_identities]
category = botsv2
description = BOTSv2 identities derived from the dataset
target = identity
url = lookup://botsv2_identities_lookup
disabled = 0
