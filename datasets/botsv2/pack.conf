# Detections switched on, on their normal schedules, while the replay is on, and
# put back as they were when it's switched off. One saved search name per line,
# continued with a trailing backslash. @risk_rule is ES's 24-hour risk threshold
# rule, found by name.
[rules]
# escu: these are switched on while BOTSv2 plays. none: data only.
mode = escu
# The 44 ESCU rules that return results on raw BOTSv2 (2026-11-19 survey of 1,516 TTP and
# Anomaly rules), 1 more that fires only on the replay (live re-survey, 2026-11-19), plus ES's
# risk rule. Left out on purpose: Windows Deleted Registry By A Non Critical Process File
# Path (13,584 results in 10 h of replay, all WinRegistry housekeeping).
names = @risk_rule \
        ESCU - Common Ransomware Extensions - Rule \
        ESCU - Detect New Local Admin account - Rule \
        ESCU - Detect Password Spray Attack Behavior From Source - Rule \
        ESCU - Detect Password Spray Attack Behavior On User - Rule \
        ESCU - Detect RTLO In Process - Rule \
        ESCU - Detect Remote Access Software Usage File - Rule \
        ESCU - Detect Rare Executables - Rule \
        ESCU - Disabling Firewall with Netsh - Rule \
        ESCU - Eventvwr UAC Bypass - Rule \
        ESCU - Executables Or Script Creation In Temp Path - Rule \
        ESCU - First Time Seen Running Windows Service - Rule \
        ESCU - High Process Termination Frequency - Rule \
        ESCU - Notepad with no Command Line Arguments - Rule \
        ESCU - Possible Lateral Movement PowerShell Spawn - Rule \
        ESCU - Potential System Network Configuration Discovery Activity - Rule \
        ESCU - Process Execution via WMI - Rule \
        ESCU - Registry Keys Used For Persistence - Rule \
        ESCU - Screensaver Event Trigger Execution - Rule \
        ESCU - Services LOLBAS Execution Process Spawn - Rule \
        ESCU - Suspicious DLLHost no Command Line Arguments - Rule \
        ESCU - Suspicious Reg exe Process - Rule \
        ESCU - Suspicious Rundll32 no Command Line Arguments - Rule \
        ESCU - Suspicious SearchProtocolHost no Command Line Arguments - Rule \
        ESCU - Suspicious wevtutil Usage - Rule \
        ESCU - System Processes Run From Unexpected Locations - Rule \
        ESCU - Unusually Long Command Line - Rule \
        ESCU - Windows Alternate DataStream - Process Execution - Rule \
        ESCU - Windows Application Whitelisting Bypass Attempt via Rundll32 - Rule \
        ESCU - Windows Chromium Browser No Security Sandbox Process - Rule \
        ESCU - Windows Create Local Account - Rule \
        ESCU - Windows Credentials in Registry Reg Query - Rule \
        ESCU - Windows HTTP Network Communication From MSIExec - Rule \
        ESCU - Windows Known Abused DLL Created - Rule \
        ESCU - Windows LOLBAS Executed Outside Expected Path - Rule \
        ESCU - Windows Modify Registry ProxyServer - Rule \
        ESCU - Windows Process With NamedPipe CommandLine - Rule \
        ESCU - Windows PuTTY Suite Utility Execution - Rule \
        ESCU - Windows Registry Certificate Added - Rule \
        ESCU - Windows RunMRU Command Execution - Rule \
        ESCU - Windows Scheduled Task Created Via XML - Rule \
        ESCU - Windows Schtasks Create Run As System - Rule \
        ESCU - Windows Svchost.exe Parent Process Anomaly - Rule \
        ESCU - Windows TOR Client Execution - Rule \
        ESCU - Windows UAC Bypass Suspicious Child Process - Rule \
        ESCU - Windows UAC Bypass Suspicious Escalation Behavior - Rule

# Cleared when the loop wraps, so first-seen rules fire again (lookup names).
reset_lookups = previously_seen_running_windows_services
# Extra SPL run when the loop wraps, one per line.
reset_searches =
# Longest throttle a listed rule may keep while on, in seconds. Empty: rules keep
# their own. Daily: 72000 (20 h), so each entity gets at most one finding a day.
# For schedule = loop use 21600 (under the 6.5 h loop).
suppress_period = 72000
# The risk rule's time range while on (ES 8.8: -1450m@m to -10m@m, 24 h). Daily:
# -490m@m (8 h, ending at ES's own -10m@m) sums the workday, so
# an entity drops below the threshold overnight and its finding comes when it
# crosses again during the next workday. Empty: the rule keeps its own.
risk_earliest =
# The risk rule's throttle fields while on (ES: source_count, normalized_risk_object,
# risk_object_type). ES re-fires an entity for every new contributing rule (up to 13
# a day per entity on the test box); the entity alone gives one finding per entity
# a day. Empty: the rule keeps its own.
risk_suppress_fields = normalized_risk_object, risk_object_type
# BOTSv2 lacks a user or source IP in some sources, so ESCU writes risk on "unknown" and "null".
# The risk rule raises no finding on these while the replay is on; the risk events stay.
skip_risk_objects = unknown, null
