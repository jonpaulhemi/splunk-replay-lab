# The BOTSv2 pack: how the replay plays it. build.py writes these stanzas into the app's
# default/replay_lab.conf as [dataset:botsv2], [feed:botsv2:<name>] and [rules:botsv2].
# Change a setting on a running box from the settings page, or in local/replay_lab.conf
# under those stanza names.

[dataset]
label = BOTSv2
# 1 sends events; 0 pauses (switching back on starts from now, no flood).
enabled = 0
# Where replayed events go.
index = botsv2_live
# Where the export reads from.
source_index = botsv2
tick_seconds = 30
# After downtime longer than this, skip ahead instead of catching up.
max_catchup_seconds = 3600
# BOTSv2 is a month (August 2017). The replay plays seven of its UTC days, one per day
# at real speed, back to back: the days where the most ESCU rules fire (2026-11-19
# survey on raw BOTSv2). In order: Aug 24 (31 rules, the APT), Aug 19 (25), Aug 26 (26),
# Aug 16 (21), Aug 25 (19), Aug 18 (21), Aug 10 (21). Start-end epoch pairs.
segments = 1503532800-1503619200 \
           1503100800-1503187200 \
           1503705600-1503792000 \
           1502841600-1502928000 \
           1503619200-1503705600 \
           1503014400-1503100800 \
           1502323200-1502409600
# loop: one segment per 24 h period from the anchor, so each day plays the next segment.
# The anchor is a midnight US Eastern (here 2026-11-19 00:00 EST), so a segment's 00:00 UTC plays at
# 00:00 EST; after the daylight saving change the day starts at 01:00 EDT.
schedule = loop
anchor = 1795064400

