# Splunk_TA_nix and Splunk_TA_windows split these table-shaped events into one result per row
# (KV_MODE = multi). The export runs in this app's context, where these stanzas win, so it gets
# whole events. metadata/default.meta keeps them out of every other app, ES and its rules included.
[bandwidth]
KV_MODE = none

[cpu]
KV_MODE = none

[df]
KV_MODE = none

[interfaces]
KV_MODE = none

[iostat]
KV_MODE = none

[lastlog]
KV_MODE = none

[lsof]
KV_MODE = none

[netstat]
KV_MODE = none

[package]
KV_MODE = none

[protocol]
KV_MODE = none

[openPorts]
KV_MODE = none

[ps]
KV_MODE = none

[top]
KV_MODE = none

[who]
KV_MODE = none

[perfmonmk:process]
KV_MODE = none

[PerfmonMk:Process]
KV_MODE = none

# Splunk_TA_nix's stanza name is case-sensitive.
[usersWithLoginPrivs]
KV_MODE = none

# system/default/props.conf splits PerfmonMk by source (KV_MODE = multi_PerfmonMk), and a
# source:: stanza outranks a sourcetype stanza.
[source::PerfmonMk...]
KV_MODE = none

# Index time. WinHostMon events carry no time of their own, so Splunk would take one from
# fields like StartTime (days before the event). The input's time is the right one, for the
# replay and for real WinHostMon data alike. Splunk_TA_windows' [WinHostMon] sets no time
# settings, so this one applies.
[WinHostMon]
DATETIME_CONFIG = NONE

# Index time. Sysmon's first time (SystemTime='...Z', nine-digit fraction) isn't one
# Splunk's default timestamp rules read, so it took a later field such as UtcTime, often
# a process start long before. The replay's own time is the right one. This is BOTSv2's
# legacy sourcetype name; current Sysmon inputs index as XmlWinEventLog, which is untouched.
[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
DATETIME_CONFIG = NONE

# Feeds where Splunk read the wrong in-text time (found in live checks), so the
# replay's own time is used. No add-on on the box sets time settings for these sourcetypes.
# aws:config:rule: Splunk ignores the "+00:00" on ComplianceSummaryTimestamp (5 h ahead).
[aws:config:rule]
DATETIME_CONFIG = NONE

# aws:rds:error: zoneless UTC text read in the indexer's zone (5 h ahead).
[aws:rds:error]
DATETIME_CONFIG = NONE

# code42: Splunk picks a later time than the event's, such as modular_input_consumption_time
# or lastConnected (up to 1 h 46 min ahead).
[code42:security]
DATETIME_CONFIG = NONE

[code42:computer]
DATETIME_CONFIG = NONE

[code42:user]
DATETIME_CONFIG = NONE
