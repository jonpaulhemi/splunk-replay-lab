# Run by hand (not scheduled). Lists replayed events that still carry a BOTSv2
# in-window date in their raw text, by sourcetype. S3 access-log object
# keys (".../s32018-08-20-...") are file names, not times, and are expected.
[BOTSv2 replay - leftover 2018 timestamps]
search = index=botsv2_live ("2018-08-20" OR "2018-08-19" OR "08/20/2018" OR "08/19/2018" OR "20/Aug/2018" OR "20180820" OR "20 Aug 2018" OR "Aug2018") \
| eval found=mvappend(if(match(_raw, "2018-08-(19|20)[T ]\d"), "iso", null()), if(match(_raw, "08/(19|20)/2018"), "us", null()), if(match(_raw, "20/Aug/2018"), "clf", null()), if(match(_raw, "20180820 \d"), "compact", null()), if(match(_raw, "20 Aug ?2018"), "rfc2822", null()), if(match(_raw, "s32018-08-"), "s3_key", null())) \
| stats count by sourcetype found
dispatch.earliest_time = -7d
dispatch.latest_time = now
enableSched = 0
disabled = 0
