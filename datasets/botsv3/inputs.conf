# Register the BOTSv3 lists with ES's asset and identity framework
# (SA-IdentityManagement merges them into asset_lookup_by_* / identity_lookup_expanded).
[identity_manager://botsv3_assets]
category = botsv3
description = BOTSv3 assets derived from the dataset
target = asset
url = lookup://botsv3_assets_lookup
disabled = 0

[identity_manager://botsv3_identities]
category = botsv3
description = BOTSv3 identities derived from the dataset
target = identity
url = lookup://botsv3_identities_lookup
disabled = 0
