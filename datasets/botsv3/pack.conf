# osquery_results feed.
[feed:osquery_process]
search = sourcetype="osquery:results" "pack_process-monitoring_proc_events"
set_sourcetype = osquery:results
json_set = columns.event_type=exec

# Detections the lab enables on their normal schedules while the replay is on,
# and puts back as they were when it's switched off. One saved search
# name per line, continued with a trailing backslash. @risk_rule is ES's
# 24-hour risk threshold rule, found by name: 38 detections that fire over the
# original BOTSv3 index, plus 15 that fire only on the replay.
[rules]
# escu: these are switched on while BOTSv3 plays. none: data only.
mode = escu
names = @risk_rule \
        ESCU - Protocol or Port Mismatch - Rule \
        ESCU - System Processes Run From Unexpected Locations - Rule \
        ESCU - Windows Svchost.exe Parent Process Anomaly - Rule \
        ESCU - Suspicious Reg exe Process - Rule \
        ESCU - Suspicious SearchProtocolHost no Command Line Arguments - Rule \
        ESCU - Suspicious DLLHost no Command Line Arguments - Rule \
        ESCU - Unusually Long Command Line - Rule \
        ESCU - Detect Rare Executables - Rule \
        ESCU - Prohibited Network Traffic Allowed - Rule \
        ESCU - Protocols passing authentication in cleartext - Rule \
        ESCU - Windows LOLBAS Executed Outside Expected Path - Rule \
        ESCU - HTTP Scripting Tool User Agent - Rule \
        ESCU - Windows Process Execution in Temp Dir - Rule \
        ESCU - Remote Desktop Network Traffic - Rule \
        ESCU - First Time Seen Running Windows Service - Rule \
        ESCU - LOLBAS Rare Network Connection - Rule \
        ESCU - DNS Query Length With High Standard Deviation - Rule \
        ESCU - Suspicious Rundll32 no Command Line Arguments - Rule \
        ESCU - Windows PuTTY Suite Utility Execution - Rule \
        ESCU - Excessive DNS Failures - Rule \
        ESCU - Exploit Public Facing Application via Apache Commons Text - Rule \
        ESCU - Windows Unusual SysWOW64 Process Run System32 Executable - Rule \
        ESCU - Potential System Network Configuration Discovery Activity - Rule \
        ESCU - Windows Process With NamedPipe CommandLine - Rule \
        ESCU - Possible Lateral Movement PowerShell Spawn - Rule \
        ESCU - FodHelper UAC Bypass - Rule \
        ESCU - Detect New Local Admin account - Rule \
        ESCU - Windows Create Local Account - Rule \
        ESCU - Windows File Transfer Protocol In Non-Common Process Path - Rule \
        ESCU - Windows Office Product Dropped Uncommon File - Rule \
        ESCU - Cisco Network Interface Modifications - Rule \
        ESCU - O365 Email Transport Rule Changed - Rule \
        ESCU - Process Execution via WMI - Rule \
        ESCU - Disabling Firewall with Netsh - Rule \
        ESCU - Windows Create Local Administrator Account Via Net - Rule \
        ESCU - Email Attachments With Lots Of Spaces - Rule \
        ESCU - HTTP PUA User Agent - Rule \
        ESCU - Suspicious Java Classes - Rule \
        ESCU - Linux Possible Access To Credential Files - Rule \
        ESCU - Detect Remote Access Software Usage DNS - Rule \
        ESCU - Executables Or Script Creation In Temp Path - Rule \
        ESCU - Windows Service Creation Using Registry Entry - Rule \
        ESCU - Windows WPDBusEnum Registry Key Modification - Rule \
        ESCU - Registry Keys Used For Persistence - Rule \
        ESCU - Windows UAC Bypass Suspicious Escalation Behavior - Rule \
        ESCU - Windows UAC Bypass Suspicious Child Process - Rule \
        ESCU - Windows USBSTOR Registry Key Modification - Rule \
        ESCU - Windows Scheduled Task Service Spawned Shell - Rule \
        ESCU - Windows Boot or Logon Autostart Execution In Startup Folder - Rule \
        ESCU - Windows User Execution Malicious URL Shortcut File - Rule \
        ESCU - Linux Obfuscated Files or Information Base64 Decode - Rule \
        ESCU - Linux Possible Access To Sudoers File - Rule \
        ESCU - System Information Discovery Detection - Rule
# Cleared when the loop wraps, so first-seen rules fire again (lookup names).
reset_lookups = previously_seen_running_windows_services
# Extra SPL run when the loop wraps, one per line.
reset_searches =
# Longest throttle a listed rule may keep while on, in seconds. Empty: rules keep
# their own. Daily: 72000 (20 h), so each entity gets at most one finding a day.
# For schedule = loop use 21600 (under the 6.5 h loop).
suppress_period = 72000
# The risk rule's time range while on (ES 8.8: -1450m@m to -10m@m, 24 h). Daily:
# -490m@m (8 h, ending at ES's own -10m@m) sums the workday, so
# an entity drops below the threshold overnight and its finding comes when it
# crosses again during the next workday. Empty: the rule keeps its own.
risk_earliest = -490m@m
# The risk rule's throttle fields while on (ES: source_count, normalized_risk_object,
# risk_object_type). ES re-fires an entity for every new contributing rule (up to 13
# a day per entity in testing); the entity alone gives one finding per entity
# a day. Empty: the rule keeps its own.
risk_suppress_fields = normalized_risk_object, risk_object_type
# BOTSv3 lacks a user or source IP in some sources, so ESCU writes risk on "unknown" and "null".
# The risk rule raises no finding on these while the replay is on; the risk events stay.
skip_risk_objects = unknown, null
