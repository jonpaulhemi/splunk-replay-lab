# The BOTSv3 pack: how the replay plays it. build.py writes these stanzas into the app's
# default/replay_lab.conf as [dataset:botsv3], [feed:botsv3:<name>] and [rules:botsv3].
# Change a setting on a running box from the settings page, or in local/replay_lab.conf
# under those stanza names.

[dataset]
label = BOTSv3
# 1 sends events; 0 pauses (switching back on starts from now, no flood).
enabled = 0
# Where replayed events go.
index = botsv3_live
# Where the export reads from.
source_index = botsv3
tick_seconds = 30
# After downtime longer than this, skip ahead instead of catching up.
max_catchup_seconds = 3600
# Epoch the replay counts from (the first loop, or the first day). Empty = the
# first tick after switching on.
anchor =
# The part of BOTSv3 replayed, as epoch seconds: 2018-08-20 09:00 to 15:30 UTC,
# where nearly all of it is. It is one 6.5-hour workday.
window_start = 1534755600
window_end = 1534779000
# daily: the workday plays once a day at real speed from daily_start (HH:MM) in
# schedule_timezone (a zone name, or local), and nothing plays the rest of the
# day. loop: it repeats back to back from the anchor, about 3.7 times a day.
schedule = daily
daily_start = 09:00
schedule_timezone = America/New_York

# One [feed:<name>] per indexed sourcetype (all of BOTSv3 except the stray
# ess_content_importer). `search` is added to `search index=<source_index>`;
# Windows feeds select by source, because Splunk_TA_windows renames their
# sourcetypes at search time. set_sourcetype writes the indexed name, so the
# renames apply to the replay too. Optional: set_source, timestamp_formats
# (any of iso us clf rfc2822 compact glog syslog ctime epoch; default all),
# json_set (dotted.path=value inside JSON events), translate (opt-in, marks
# events synthetic; none ship yet), enabled = 0.
