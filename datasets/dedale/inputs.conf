# Register the DEDALE lists with ES's asset and identity framework
# (SA-IdentityManagement merges them into asset_lookup_by_* / identity_lookup_expanded).
[identity_manager://dedale_assets]
category = dedale
description = DEDALE assets derived from the dataset
target = asset
url = lookup://dedale_assets_lookup
disabled = 0

[identity_manager://dedale_identities]
category = dedale
description = DEDALE identities derived from the dataset
target = identity
url = lookup://dedale_identities_lookup
disabled = 0
