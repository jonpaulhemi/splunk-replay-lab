# The DEDALE pack: how the replay plays it. build.py writes these stanzas into the app's
# default/replay_lab.conf as [dataset:dedale], [feed:dedale:<name>] and [rules:dedale].
# Change a setting on a running box from the settings page, or in local/replay_lab.conf
# under those stanza names.

[dataset]
label = DEDALE
# Add-ons its detections need; Prepare warns about any that are missing.
requires = Splunk_SA_CIM, DA-ESS-ContentUpdate, Splunk_TA_windows, Splunk_TA_microsoft_sysmon, Splunk_TA_nix
# 1 sends events; 0 pauses (switching back on starts from now, no flood).
enabled = 0
# Where replayed events go.
index = dedale_live
# Where the export reads from: DEDALE host logs rebuilt as Windows XML and auditd text
# (datasets/dedale/load/dedale_convert.py) and loaded with dedale_load.py.
source_index = dedale
tick_seconds = 30
# After downtime longer than this, skip ahead instead of catching up.
max_catchup_seconds = 3600
# DEDALE is four weeks (2024-12-23 to 2025-01-19 UTC); the APT runs 2025-01-06 to 01-13.
# The replay plays 2024-12-30 to 2025-01-14 in order, one UTC day per real day: seven benign
# days first (Dec 30 to Jan 3 are full simulated workdays, holidays included; Jan 4 and 5 a
# weekend), then the eight attack days, then one day after. Benign first, so tier 0 changes
# can be checked against over-escalation before the attack starts. Start-end epoch pairs.
segments = 1735516800-1735603200 \
           1735603200-1735689600 \
           1735689600-1735776000 \
           1735776000-1735862400 \
           1735862400-1735948800 \
           1735948800-1736035200 \
           1736035200-1736121600 \
           1736121600-1736208000 \
           1736208000-1736294400 \
           1736294400-1736380800 \
           1736380800-1736467200 \
           1736467200-1736553600 \
           1736553600-1736640000 \
           1736640000-1736726400 \
           1736726400-1736812800 \
           1736812800-1736899200
# loop: one segment per 24 h period from the anchor (an Eastern midnight). A 16-day cycle.
schedule = loop
anchor = 1795064400

# One [feed:<name>] per DEDALE source. `search` is added to `search index=<source_index>`.
# set_sourcetype writes the indexed name back. See botsv3_replay's README for the options.

[feed:security]
search = source="XmlWinEventLog:Security"
set_sourcetype = XmlWinEventLog
set_source = XmlWinEventLog:Security

[feed:system]
search = source="XmlWinEventLog:System"
set_sourcetype = XmlWinEventLog
set_source = XmlWinEventLog:System

[feed:application]
search = source="XmlWinEventLog:Application"
set_sourcetype = XmlWinEventLog
set_source = XmlWinEventLog:Application

[feed:sysmon]
search = source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"
set_sourcetype = XmlWinEventLog
set_source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational

[feed:powershell_operational]
search = source="XmlWinEventLog:Microsoft-Windows-PowerShell/Operational"
set_sourcetype = XmlWinEventLog
set_source = XmlWinEventLog:Microsoft-Windows-PowerShell/Operational

[feed:windows_powershell]
search = source="XmlWinEventLog:Windows PowerShell"
set_sourcetype = XmlWinEventLog
set_source = XmlWinEventLog:Windows PowerShell

# Linux audit, rebuilt from Auditbeat as auditd text (msg=audit(<epoch>:<seq>)).
[feed:auditd]
search = sourcetype="auditd"
set_sourcetype = auditd

# Detections switched on, on their normal schedules, while the replay is on, and put
# back as they were when it's switched off. @risk_rule is ES's 24-hour risk rule.
[rules]
# escu: these are switched on while DEDALE plays. none: data only.
mode = escu
# The 55 ESCU rules that return results on DEDALE 2025-01-04 to 01-14 (2026-11-19 survey
# of 1,516 TTP and Anomaly rules), plus ES's risk rule.
names = @risk_rule \
        ESCU - Create Remote Thread In Shell Application - Rule \
        ESCU - Create Remote Thread into LSASS - Rule \
        ESCU - DNS Query Length With High Standard Deviation - Rule \
        ESCU - Detect Credential Dumping through LSASS access - Rule \
        ESCU - Detect Remote Access Software Usage DNS - Rule \
        ESCU - Excessive Usage Of Taskkill - Rule \
        ESCU - Executables Or Script Creation In Temp Path - Rule \
        ESCU - Linux Auditd Edit Cron Table Parameter - Rule \
        ESCU - Linux Auditd File And Directory Discovery - Rule \
        ESCU - Linux Auditd Install Kernel Module Using Modprobe Utility - Rule \
        ESCU - Linux Auditd Sudo Or Su Execution - Rule \
        ESCU - Linux Auditd Web or Application Server Spawning a Shell - Rule \
        ESCU - Possible Lateral Movement PowerShell Spawn - Rule \
        ESCU - Process Execution via WMI - Rule \
        ESCU - Prohibited Network Traffic Allowed - Rule \
        ESCU - Ransomware Notes bulk creation - Rule \
        ESCU - Rundll32 Create Remote Thread To A Process - Rule \
        ESCU - Rundll32 DNSQuery - Rule \
        ESCU - Spoolsv Spawning Rundll32 - Rule \
        ESCU - Spoolsv Suspicious Process Access - Rule \
        ESCU - Spoolsv Writing a DLL - Rule \
        ESCU - Spoolsv Writing a DLL - Sysmon - Rule \
        ESCU - Suspicious DLLHost no Command Line Arguments - Rule \
        ESCU - Suspicious GPUpdate no Command Line Arguments - Rule \
        ESCU - Suspicious Reg exe Process - Rule \
        ESCU - Suspicious Rundll32 no Command Line Arguments - Rule \
        ESCU - Suspicious SearchProtocolHost no Command Line Arguments - Rule \
        ESCU - Svchost LOLBAS Execution Process Spawn - Rule \
        ESCU - System Processes Run From Unexpected Locations - Rule \
        ESCU - Unusually Long Command Line - Rule \
        ESCU - Windows Abused Web Services - Rule \
        ESCU - Windows Access Token Winlogon Duplicate Handle In Uncommon Path - Rule \
        ESCU - Windows Admin Permission Discovery - Rule \
        ESCU - Windows Archived Collected Data In TEMP Folder - Rule \
        ESCU - Windows Cmdline Tool Execution From Non-Shell Process - Rule \
        ESCU - Windows Data Destruction Recursive Exec Files Deletion - Rule \
        ESCU - Windows Disable or Modify Tools Via Taskkill - Rule \
        ESCU - Windows File Collection Via Copy Utilities - Rule \
        ESCU - Windows File Without Extension In Critical Folder - Rule \
        ESCU - Windows Gather Victim Network Info Through Ip Check Web Services - Rule \
        ESCU - Windows High File Deletion Frequency - Rule \
        ESCU - Windows Known Abused DLL Loaded Suspiciously - Rule \
        ESCU - Windows Non-System Account Targeting Lsass - Rule \
        ESCU - Windows Possible Credential Dumping - Rule \
        ESCU - Windows Process Execution in Temp Dir - Rule \
        ESCU - Windows Process Injection Remote Thread - Rule \
        ESCU - Windows Process Injection into Commonly Abused Processes - Rule \
        ESCU - Windows Process With NamedPipe CommandLine - Rule \
        ESCU - Windows Raw Access To Disk Volume Partition - Rule \
        ESCU - Windows Suspicious C2 Named Pipe - Rule \
        ESCU - Windows Svchost.exe Parent Process Anomaly - Rule \
        ESCU - Windows System Shutdown CommandLine - Rule \
        ESCU - Windows Terminating Lsass Process - Rule \
        ESCU - Windows Unsigned DLL Side-Loading - Rule \
        ESCU - Windows Unusual Process Load Mozilla NSS-Mozglue Module - Rule

# Cleared when the loop wraps, so first-seen rules fire again (lookup names).
reset_lookups = previously_seen_running_windows_services
# Extra SPL run when the loop wraps, one per line.
reset_searches =
# Longest throttle a listed rule may keep while on, in seconds. Empty: rules keep
# their own. Daily: 72000 (20 h), so each entity gets at most one finding a day.
# For schedule = loop use 21600 (under the 6.5 h loop).
suppress_period = 72000
# The risk rule's time range while on (ES 8.8: -1450m@m to -10m@m, 24 h). Daily:
# -490m@m (8 h, ending at ES's own -10m@m) sums the workday, so
# an entity drops below the threshold overnight and its finding comes when it
# crosses again during the next workday. Empty: the rule keeps its own.
risk_earliest =
# The risk rule's throttle fields while on (ES: source_count, normalized_risk_object,
# risk_object_type). ES re-fires an entity for every new contributing rule (up to 13
# a day per entity on the test box); the entity alone gives one finding per entity
# a day. Empty: the rule keeps its own.
risk_suppress_fields = normalized_risk_object, risk_object_type
# DEDALE lacks a user or source IP in some sources, so ESCU writes risk on "unknown" and "null".
# The risk rule raises no finding on these while the replay is on; the risk events stay.
skip_risk_objects = unknown, null
