# Who holds which detection, and its settings from before any dataset changed it (one record per
# rule; see bin/replaylib/ledger.py).
[replay_lab_rules]
field.name = string
field.app = string
field.original = string
field.holders = array
field.version = number

# Claims on a rule record's next version, so changes from several datasets or members happen one
# after another.
[replay_lab_claims]
field.rule = string
field.version = number
field.at = number
field.by = string

# Each dataset's latest status, written by the input on the member that plays it (key: dataset).
[replay_lab_status]
field.dataset = string
field.member = string
field.state = string
field.at = number
field.updated = number
