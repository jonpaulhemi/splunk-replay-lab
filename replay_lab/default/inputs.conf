# The app's own inputs. build.py appends one replay_lab://<dataset> stanza per pack, and any
# inputs a pack ships (such as ES asset and identity registrations).
#
# The process always runs; enabled in [dataset:<name>] (replay_lab.conf) decides whether it
# sends anything, and is re-read every tick. splunkd discovers the input only because
# README/inputs.conf.spec declares a parameter. interval lives on the scheme stanza only:
# declared in the spec or set on an instance, splunkd stops restarting the process after it
# exits. Splunk 10.2+ reads python.required.
[replay_lab]
interval = 60
python.version = python3
python.required = 3.9, 3.13

# One status log per dataset, one JSON line per tick.
[monitor://$SPLUNK_HOME/var/log/replay_lab]
whitelist = \.log$
index = _internal
sourcetype = replay_lab:status
disabled = 0
