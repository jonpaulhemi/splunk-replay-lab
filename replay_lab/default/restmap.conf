# The settings page's API, admins only (the handler checks admin_all_objects too):
#   GET  /services/replay_lab/datasets[/<name>]
#   POST /services/replay_lab/datasets/<name>
#   GET  /services/replay_lab/members
[script:replay_lab_settings]
match = /replay_lab
script = replay_lab_rest.py
scripttype = persist
handler = replay_lab_rest.Settings
requireAuthentication = true
capability = admin_all_objects
passPayload = true
output_modes = json
python.version = python3
python.required = 3.9, 3.13
