# The EXAMPLE pack. Copy this folder with `python3 tools/new_pack.py <name>`, which renames
# "example" throughout. The format is in docs/pack-format.md; every setting is in
# replay_lab/README/replay_lab.conf.spec.

[dataset]
# The dataset's name on the settings page.
label = Example
# Apps its detections need. Prepare dataset warns about any that are missing and still runs.
requires = Splunk_SA_CIM, DA-ESS-ContentUpdate
enabled = 0
# Where replayed events go and where the export reads from (defaults: <name>_live and <name>).
index = example_live
source_index = example
tick_seconds = 30
max_catchup_seconds = 3600
anchor =
# The part of the dataset replayed, as epoch seconds (here one hour of 2001-09-09 UTC). Empty:
# all of the source index, rounded to whole hours. For several windows that play in turn, set
# segments = <start-end> <start-end> ... instead (all the same length).
window_start = 1000000800
window_end = 1000004400
schedule = loop
daily_start = 09:00
schedule_timezone = America/New_York
rules_mode = none

# One [feed:<name>] per sourcetype (or source) replayed. `search` is added to
# `search index=<source_index>`. set_sourcetype writes the indexed name, so search-time renames
# in the add-ons apply to the replay as they do to the original.
[feed:syslog]
search = sourcetype="syslog"
set_sourcetype = syslog

[feed:windows_security]
search = source="WinEventLog:Security"
set_sourcetype = WinEventLog
set_source = WinEventLog:Security
# Windows writes these times in the indexer's zone, without one: write them back the same way.
text_timezone = local
# Off until it's checked; an off feed is neither exported nor replayed.
enabled = 0

[rules]
# escu: the listed saved searches are switched on while the dataset plays and put back after.
# none: data only (the dataset above sets rules_mode = none).
mode = escu
names = ESCU - Example Detection - Rule
